<!-- Schoneveld Breeding
 QR vergelijker
 20-11-2025, DDamen-->

<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Controle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Reset linksboven -->
<button id="resetBtn" class="reset-btn">Reset</button>

<!-- Centrale status -->
<div id="status" class="status">Scan 1e QR</div>

<!-- Na 1e scan -->
<div id="midScreen" class="mid-screen hidden">
  <div class="mid-text">1e QR gescand</div>
  <button id="midNextBtn">Scan volgende</button>
</div>

<!-- Resultaat -->
<div id="resultScreen" class="result-screen hidden">
  <div id="resultText" class="result-text"></div>
</div>

<!-- Onderin: mode -->
<div id="modeBar" class="mode-bar">
  <div id="modeEnkel" class="mode-btn active">
    Enkel
    <div class="overlay"></div>
  </div>
  <div id="modeMeerdere" class="mode-btn">
    Meerdere
    <div class="overlay"></div>
  </div>
</div>
