<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Controle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Status -->
  <div id="status" class="status">Start scannen</div>

  <!-- Result -->
  <div id="resultScreen" class="result-screen hidden">
    <div id="resultText" class="result-text"></div>
    <div class="scanned-info">
      <div><strong><span id="firstLabel">1e</span>:</strong> <span id="firstScannedValue"></span></div>
      <div><strong><span id="secondLabel">2e</span>:</strong> <span id="secondScannedValue"></span></div>
    </div>
  </div>

  <!-- Mode switch -->
  <div id="modeBar" class="mode-bar">
    <div id="modeEnkel" class="mode-btn active">Enkel</div>
    <div id="modeMeerdere" class="mode-btn">Meerdere</div>
  </div>

  <!-- Reset button at bottom -->
  <button id="resetBtn" class="reset-btn">Reset</button>

  <!-- Script -->
  <script src="app.js"></script>
</body>
</html>
